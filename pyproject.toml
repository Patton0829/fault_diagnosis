[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fault-diagnosis-qa-platform"
version = "0.1.0"
description = "逐步学习文档处理、混合检索、Milvus和证据问答的本地项目"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx", "numpy", "python-dotenv", "openai", "pydantic",
    "langchain-core", "langchain-text-splitters", "rank-bm25", "jieba",
    "PyYAML", "requests", "fastapi", "uvicorn",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
milvus = ["pymilvus==2.6.17", "milvus-lite==3.2.2"]
workflow = ["langgraph==1.2.16", "langsmith>=0.14.9,<1.0.0"]
database = ["SQLAlchemy>=2.0,<2.1", "PyMySQL[rsa]>=1.1,<2"]
cache = ["redis==8.1.0"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"qa_platform.ingestion" = ["_snapshots/k8s_prepare_v1/*.py"]
"qa_platform.workflows" = ["replay_fixture.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
extend-exclude = ["src/qa_platform/ingestion/_snapshots"]
